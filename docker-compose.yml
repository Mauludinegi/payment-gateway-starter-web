# Runs the whole stack. Expects the backend repo cloned next to this one:
#   git clone https://github.com/Mauludinegi/payment-gateway-starter.git ../payment-gateway-starter
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      retries: 10

  api:
    build: ../payment-gateway-starter
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ../payment-gateway-starter/.env
        required: false
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/payments
      DATABASE_USERNAME: payments
      DATABASE_PASSWORD: payments
      PAYMENTS_RETURN_URL: http://localhost:3000/orders/{orderId}
    ports:
      - "8080:8080" # gateway webhooks go straight to the API

  web:
    build: .
    depends_on:
      - api
    environment:
      NUXT_API_BASE: http://api:8080
    ports:
      - "3000:3000"

volumes:
  pgdata:
